<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="820" height="420" rx="14" fill="#0f172a"/>
  <text x="410" y="38" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="600">FRDM-MCXA156 — Phase 1 wiring (LPUART1 ⇄ LPUART2)</text>

  <!-- mikroBUS J5 -->
  <rect x="50" y="80" width="250" height="250" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="175" y="108" text-anchor="middle" fill="#38bdf8" font-size="16" font-weight="600">mikroBUS  J5  (LPUART1)</text>
  <g font-size="14" fill="#cbd5e1">
    <text x="70" y="150">J5[1]  P3_18  PWM</text>
    <text x="70" y="180">J5[2]  P3_19  INT</text>
    <rect x="62" y="194" width="226" height="26" rx="5" fill="#0ea5e9" opacity="0.25"/>
    <text x="70" y="212" fill="#f8fafc" font-weight="600">J5[3]  P3_20  RX1</text>
    <rect x="62" y="226" width="226" height="26" rx="5" fill="#f97316" opacity="0.25"/>
    <text x="70" y="244" fill="#f8fafc" font-weight="600">J5[4]  P3_21  TX1</text>
    <text x="70" y="276">J5[5]  P3_27  SCL</text>
    <text x="70" y="306">J5[6]  P3_28  SDA</text>
  </g>
  <circle cx="288" cy="207" r="6" fill="#0ea5e9"/>
  <circle cx="288" cy="239" r="6" fill="#f97316"/>

  <!-- Arduino J1 -->
  <rect x="520" y="80" width="250" height="250" rx="10" fill="#1e293b" stroke="#a3e635" stroke-width="2"/>
  <text x="645" y="108" text-anchor="middle" fill="#a3e635" font-size="16" font-weight="600">Arduino  J1  (LPUART2)</text>
  <g font-size="14" fill="#cbd5e1">
    <rect x="532" y="194" width="226" height="26" rx="5" fill="#0ea5e9" opacity="0.25"/>
    <text x="560" y="212" fill="#f8fafc" font-weight="600">J1[2]  P2_11  RX2 (D0)</text>
    <rect x="532" y="226" width="226" height="26" rx="5" fill="#f97316" opacity="0.25"/>
    <text x="560" y="244" fill="#f8fafc" font-weight="600">J1[4]  P2_10  TX2 (D1)</text>
  </g>
  <circle cx="532" cy="207" r="6" fill="#0ea5e9"/>
  <circle cx="532" cy="239" r="6" fill="#f97316"/>

  <!-- crossed wires -->
  <path d="M288 239 C 400 239, 420 207, 532 207" stroke="#f97316" stroke-width="4" fill="none"/>
  <path d="M532 239 C 420 239, 400 207, 288 207" stroke="#38bdf8" stroke-width="4" fill="none" stroke-dasharray="10 6"/>

  <g font-size="14">
    <text x="410" y="360" text-anchor="middle" fill="#fdba74">━━  TX1 (J5[4]) → RX2 (J1[2])</text>
    <text x="410" y="385" text-anchor="middle" fill="#7dd3fc">╍╍  TX2 (J1[4]) → RX1 (J5[3])</text>
    <text x="410" y="408" text-anchor="middle" fill="#94a3b8" font-size="12">115200 baud · 8N1 · common GND on the same board · all pins mux Alt3</text>
  </g>
</svg>
